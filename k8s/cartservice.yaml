apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  namespace: shopsphere
  labels:
    app.kubernetes.io/name: cartservice
    app.kubernetes.io/part-of: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
        app.kubernetes.io/part-of: shopsphere
    spec:
      serviceAccountName: cartservice
      containers:
        - name: server
          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice:v0.10.7
          ports:
            - containerPort: 7070
          env:
            - name: REDIS_ADDR
              value: "redis-cart:6379"
          readinessProbe:
            grpc:
              port: 7070
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 7070
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 30m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
        # Readiness gate: pod is Ready only if the Redis address the app uses is reachable.
        # The cartservice image has no shell, so this check runs in a sidecar.
        - name: redis-check
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          env:
            - name: REDIS_ADDR
              value: "redis-cart:6379"
          readinessProbe:
            exec:
              command: ["sh", "-c", "nc -z -w 2 ${REDIS_ADDR%:*} ${REDIS_ADDR##*:}"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 5m
              memory: 4Mi
            limits:
              cpu: 20m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  namespace: shopsphere
  labels:
    app.kubernetes.io/name: cartservice
spec:
  type: ClusterIP
  selector:
    app: cartservice
  ports:
    - name: grpc
      port: 7070
      targetPort: 7070
