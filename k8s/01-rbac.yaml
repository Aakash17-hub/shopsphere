apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-viewer
  namespace: shopsphere
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-viewer
  namespace: shopsphere
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-viewer
  namespace: shopsphere
subjects:
  - kind: ServiceAccount
    name: ops-viewer
    namespace: shopsphere
roleRef:
  kind: Role
  name: ops-viewer
  apiGroup: rbac.authorization.k8s.io
