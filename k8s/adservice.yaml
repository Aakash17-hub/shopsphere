apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: shopsphere
  labels:
    app.kubernetes.io/name: adservice
    app.kubernetes.io/part-of: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
        app.kubernetes.io/part-of: shopsphere
    spec:
      containers:
        - name: server
          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice:v0.10.7
          ports:
            - containerPort: 9555
          env:
            - name: PORT
              value: "9555"
          readinessProbe:
            grpc:
              port: 9555
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 9555
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 300Mi
---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  namespace: shopsphere
  labels:
    app.kubernetes.io/name: adservice
spec:
  type: ClusterIP
  selector:
    app: adservice
  ports:
    - name: grpc
      port: 9555
      targetPort: 9555
