apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: shopsphere-cart
  namespace: monitoring
  labels:
    release: monitoring
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
      - http://frontend.shopsphere.svc.cluster.local/cart
