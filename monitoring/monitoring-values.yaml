alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
    - slack-webhook
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  config:
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      routes:
      - receiver: webhook-critical
        matchers:
        - severity="critical"
      - receiver: webhook-warning
        matchers:
        - severity="warning"
    receivers:
    - name: "null"
    - name: webhook-critical
      webhook_configs:
      - url: http://alert-sink.monitoring.svc:8080/critical
        send_resolved: true
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          {{ range .Alerts }}{{ .Labels.alertname }} in {{ .Labels.namespace }}: {{ .Annotations.summary }}
          {{ end }}
    - name: webhook-warning
      webhook_configs:
      - url: http://alert-sink.monitoring.svc:8080/warning
        send_resolved: true
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          {{ range .Alerts }}{{ .Labels.alertname }} in {{ .Labels.namespace }}: {{ .Annotations.summary }}
          {{ end }}
nodeExporter:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 2d
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 900Mi
grafana:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
